<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Mess Counter</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#16202B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#16202B; --ink-2:#22303F; --line:#334455;
  --enamel:#EDEEEA; --white:#FFF; --paper-line:#D5D8D2;
  --served:#1F7A4C; --served-soft:#E2F0E8;
  --miss:#B4342B; --parcel:#C67A0E; --parcel-soft:#FBF0DC;
  --muted:#6B7A88; --muted-2:#95A3AE;
  --cond:'Barlow Semi Condensed','Roboto Condensed','Helvetica Neue',Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--ink);font-family:var(--cond);color:var(--ink);overscroll-behavior-y:contain}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--enamel)}

header{background:var(--ink);color:#fff;padding:10px 12px 0;position:sticky;top:0;z-index:20}
.brandrow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.brand{font-size:13px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:var(--muted-2);display:flex;align-items:center;gap:7px}
#gear{background:none;border:0;color:var(--parcel);font-size:16px;cursor:pointer;padding:0 2px;line-height:1;display:none}
#gear.on{display:inline}
#pill{margin-top:5px;display:inline-flex;align-items:center;gap:6px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--muted-2);background:var(--ink-2);border:1px solid var(--line);border-radius:20px;padding:3px 9px;cursor:pointer}
#pill .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:0 0 auto}
#pill.ok .dot{background:var(--served)}
#pill.busy .dot,#pill.wait .dot{background:var(--parcel)}
#pill.err .dot{background:var(--miss)}
.dwrap{display:flex;align-items:center;gap:4px}
#dpick{background:var(--ink-2);border:1px solid var(--line);color:#fff;border-radius:7px;height:40px;font-family:var(--mono);font-size:14px;font-weight:600;padding:0 8px;color-scheme:dark;cursor:pointer}
.step{background:var(--ink-2);border:1px solid var(--line);color:#fff;font-family:var(--cond);font-size:20px;line-height:1;width:34px;height:40px;border-radius:7px;cursor:pointer}

.meals{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 0 12px}
.meal{background:var(--ink-2);border:1px solid var(--line);border-radius:8px;padding:7px 6px 6px;text-align:left;cursor:pointer;color:#fff;font-family:var(--cond);display:flex;flex-direction:column;gap:1px;min-height:52px;justify-content:space-between}
.meal .ml{font-size:12.5px;line-height:1.1;color:var(--muted-2);text-transform:uppercase;font-weight:600}
.meal .mc{font-family:var(--mono);font-size:17px;font-weight:600;line-height:1}
.meal[aria-selected="true"]{background:var(--enamel);border-color:var(--enamel);color:var(--ink)}
.meal[aria-selected="true"] .ml{color:var(--served)}
.meal .mc.zero{color:var(--muted)}

#copybar{display:none;background:var(--parcel-soft);border-bottom:1px solid #E6D3A8;padding:11px 12px;align-items:center;gap:10px;font-size:14.5px;line-height:1.35;color:#6B4A08}
#copybar.on{display:flex}
#copybar .ct{flex:1}
#copybar b{font-weight:700}
#copyBtn{flex:0 0 auto;background:var(--parcel);border:0;color:#fff;font-family:var(--cond);font-size:14.5px;font-weight:700;padding:11px 14px;border-radius:7px;cursor:pointer}
#cx{flex:0 0 auto;background:none;border:0;font-size:20px;color:#8A6410;cursor:pointer;padding:0 2px;font-family:var(--cond)}

.controls{background:var(--enamel);border-bottom:1px solid var(--paper-line);padding:10px 12px 8px}
.searchwrap{position:relative;margin-bottom:8px}
#search{width:100%;height:46px;border:1.5px solid var(--paper-line);border-radius:8px;background:#fff;font-family:var(--cond);font-size:18px;padding:0 40px 0 12px;color:var(--ink)}
#search::placeholder{color:var(--muted-2)}
#search:focus{outline:2px solid var(--served);border-color:var(--served)}
#clearSearch{position:absolute;right:4px;top:4px;width:38px;height:38px;border:0;background:transparent;font-size:22px;color:var(--muted);cursor:pointer;display:none;font-family:var(--cond)}
.filters{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;border:1.5px solid var(--paper-line);background:#fff;border-radius:20px;padding:7px 13px;font-family:var(--cond);font-size:15px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.bulk{display:flex;gap:6px;margin-top:8px}
.bulk button{flex:1;height:44px;border-radius:8px;font-family:var(--cond);font-size:15.5px;font-weight:600;cursor:pointer;border:1.5px solid}
#serveAll{background:var(--served);border-color:var(--served);color:#fff}
#clearAll{background:#fff;border-color:var(--paper-line);color:var(--miss)}
#undo{background:#fff;border-color:var(--paper-line);color:var(--ink);flex:0 0 76px}
#undo:disabled{opacity:.35}

#list{flex:1;padding:0 0 96px}
.grouphdr{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:14px 12px 5px;background:var(--enamel);border-bottom:1px solid var(--paper-line)}
.row{display:flex;align-items:center;gap:11px;min-height:64px;padding:6px 12px;border-bottom:1px solid var(--paper-line);background:var(--white);cursor:pointer;user-select:none}
.row.on{background:var(--served-soft)}
.tick{flex:0 0 34px;height:34px;border-radius:7px;border:2px solid var(--paper-line);background:#fff;display:grid;place-items:center;font-size:20px;line-height:1;color:transparent;font-weight:700}
.row.on .tick{background:var(--served);border-color:var(--served);color:#fff}
.who{flex:1;min-width:0}
.nm{font-size:17px;font-weight:500;line-height:1.15}
.row.on .nm{font-weight:600}
.id{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:1px}
.dup{display:inline-block;background:#F6E3E1;color:var(--miss);font-family:var(--mono);font-size:10px;font-weight:600;padding:2px 5px;border-radius:3px;margin-left:6px;letter-spacing:.03em}
.row.warn{background:#FFFBF5}
.row.warn.on{background:var(--served-soft)}
.duplist{background:#fff;border:1px solid var(--paper-line);border-radius:8px;margin-bottom:12px;overflow:hidden}
.duplist div{padding:9px 12px;border-bottom:1px solid var(--paper-line);font-size:14.5px}
.duplist div:last-child{border-bottom:0}
.duplist .idl{font-family:var(--mono);font-size:12px;color:var(--muted)}
.empty{padding:44px 24px;text-align:center;color:var(--muted);font-size:16px;line-height:1.5;background:var(--enamel)}
.empty b{display:block;font-size:19px;color:var(--ink);margin-bottom:6px;font-weight:600}
.guestbtn{margin:12px;width:calc(100% - 24px);height:50px;border:1.5px dashed var(--muted-2);background:transparent;border-radius:8px;font-family:var(--cond);font-size:16px;font-weight:500;color:var(--muted);cursor:pointer}

#rail{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--ink);color:#fff;border-top:3px solid var(--served);padding:9px 12px calc(9px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.tally{display:flex;align-items:baseline;gap:7px;flex:1;min-width:0}
#count{font-family:var(--mono);font-size:34px;font-weight:600;line-height:.95;font-variant-numeric:tabular-nums}
.tallymeta{font-size:12px;line-height:1.25;color:var(--muted-2);letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.tallymeta span{display:block;color:#fff;letter-spacing:.02em;text-transform:none;font-size:13px;font-weight:500}
#finish{height:46px;padding:0 18px;border-radius:8px;border:0;background:var(--enamel);color:var(--ink);font-family:var(--cond);font-size:15.5px;font-weight:700;letter-spacing:.04em;cursor:pointer;text-transform:uppercase}
#count.bump{animation:bump .18s ease-out}
@keyframes bump{0%{transform:scale(1)}45%{transform:scale(1.17)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){#count.bump{animation:none}}

#veil{position:fixed;inset:0;background:rgba(10,16,22,.62);z-index:40;display:none}
#veil.open{display:block}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;background:var(--enamel);border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:none;max-height:90vh;overflow:auto}
#sheet.open{display:block}
#sheet h2{font-size:21px;margin:0 0 3px;font-weight:700}
#sheet .sub{color:var(--muted);font-size:14.5px;margin:0 0 14px;line-height:1.45}
.tbl{width:100%;border-collapse:collapse;font-size:15px;margin-bottom:14px;background:#fff;border:1px solid var(--paper-line)}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--paper-line)}
.tbl td:last-child{text-align:right;font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums;width:64px}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.z td{color:var(--muted-2)}
.tbl tr.tot td{border-top:2px solid var(--ink);font-weight:700;background:var(--enamel)}
#sheet button.act{width:100%;height:52px;border-radius:8px;font-family:var(--cond);font-size:16.5px;font-weight:600;cursor:pointer;margin-bottom:8px;border:1.5px solid var(--ink);background:#fff;color:var(--ink)}
#sheet button.act.primary{background:var(--ink);color:#fff}
#sheet button.act.wa{background:var(--served);border-color:var(--served);color:#fff}
#sheet input.txt{width:100%;height:48px;border:1.5px solid var(--paper-line);border-radius:8px;padding:0 12px;font-family:var(--cond);font-size:17px;margin-bottom:10px;background:#fff;color:var(--ink)}
.note{background:#fff;border-left:3px solid var(--parcel);padding:10px 12px;font-size:14px;line-height:1.5;margin-bottom:12px}
.kv{background:#fff;border:1px solid var(--paper-line);border-radius:8px;margin-bottom:12px;overflow:hidden}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:9px 12px;border-bottom:1px solid var(--paper-line);font-size:14.5px}
.kv div:last-child{border-bottom:0}
.kv span{font-family:var(--mono);font-size:12.5px;color:var(--muted);text-align:right;word-break:break-word}
#toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--ink-2);color:#fff;padding:11px 18px;border-radius:22px;font-size:15px;z-index:50;opacity:0;pointer-events:none;transition:opacity .18s;max-width:88%;text-align:center;border:1px solid var(--line)}
#toast.show{opacity:1}
:focus-visible{outline:3px solid var(--parcel);outline-offset:1px}
</style>

<div id="app">
  <header>
    <div class="brandrow">
      <div>
        <div class="brand">Mess Counter <button id="gear" title="Settings">&#9881;</button></div>
        <div id="pill"><span class="dot"></span><span id="pillText">local only</span></div>
      </div>
      <div class="dwrap">
        <button class="step" id="prevDay" aria-label="Previous day">‹</button>
        <input type="date" id="dpick" aria-label="Choose the date">
        <button class="step" id="nextDay" aria-label="Next day">›</button>
      </div>
    </div>
    <div class="meals" id="meals" role="tablist"></div>
  </header>

  <div id="copybar"><div class="ct" id="copyText"></div><button id="copyBtn">Copy</button><button id="cx" aria-label="Hide">×</button></div>

  <div class="controls">
    <div class="searchwrap">
      <input id="search" type="search" inputmode="search" autocomplete="off" placeholder="Type a name or ID to jump" aria-label="Search name or ID">
      <button id="clearSearch" aria-label="Clear search">×</button>
    </div>
    <div class="filters" id="filters"></div>
    <div class="bulk">
      <button id="serveAll">Serve everyone</button>
      <button id="clearAll">Clear all</button>
      <button id="undo" disabled>Undo</button>
    </div>
  </div>
  <div id="list"></div>
</div>

<div id="rail">
  <div class="tally">
    <div id="count">0</div>
    <div class="tallymeta">served<span id="mealNow">—</span></div>
  </div>
  <button id="finish">Send</button>
</div>

<div id="veil"></div>
<div id="sheet" role="dialog" aria-modal="true"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ═══════════════════════════════════════════════════════════════
   CONFIG — see README.md
   ═══════════════════════════════════════════════════════════════ */
const SYNC_URL   = 'https://script.google.com/macros/s/AKfycbwOkF9hzyRL9RqA3rcwcvW1iOCuQjqB_GWgm5ftvNYqCZPZaCE9SKqZ0Jv7Hlx_bz8/exec';                 // Apps Script web app URL (blank = no cloud)
const SYNC_KEY   = 'PLCT2026';  // must match SHARED_KEY in Code.gs
const ADMIN_CODE = 'pltc2026';         // ?admin=… reveals the gear
const ROSTER_URL = 'roster.csv';       // fallback name list in this folder
/* ═══════════════════════════════════════════════════════════════ */

const GROUPS={staff:'Staff',worker:'Workers',hire:'Hire manpower',guest:'Guests'};
const GORDER=['staff','worker','hire','guest'];
const MEALS=[
 {k:'bf',short:'Breakfast',col:'B/F Fast'},
 {k:'tif',short:'Lunch tiffin',col:'L/Tiffin'},
 {k:'lpar',short:'Lunch parcel',col:'L/Parsal'},
 {k:'din',short:'Dinner',col:'Dinner'},
 {k:'dpar',short:'Dinner parcel',col:'D/Parsal'},
 {k:'slun',short:'Special lunch',col:'S/Lunch'},
 {k:'sdin',short:'Special dinner',col:'S/Dinner'}
];
const DOW=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const LOOKBACK=7;

/* ── storage ─────────────────────────────────────────────────── */
const store=(()=>{
  const mem={};
  const ws=(typeof window!=='undefined'&&window.storage&&typeof window.storage.get==='function')?window.storage:null;
  return{
    async get(k){
      if(ws){try{const r=await ws.get(k);return r?JSON.parse(r.value):null;}catch(e){return null;}}
      try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return mem[k]??null;}
    },
    async set(k,v){
      if(ws){try{await ws.set(k,JSON.stringify(v));return true;}catch(e){}}
      try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){mem[k]=v;return false;}
    }
  };
})();

/* ── helpers ─────────────────────────────────────────────────── */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const pretty=s=>{const[y,m,d]=s.split('-');return `${d}/${m}/${y}`;};
const shift=(s,n)=>{const d=parseISO(s);d.setDate(d.getDate()+n);return iso(d);};
const dkey=s=>'mess:'+s;
const RKEY='mess:roster', CKEY='mess:cfg', QKEY='mess:queue';
const norm=s=>String(s).trim().replace(/\s+/g,' ').toUpperCase();
const pkey=(id,nm)=>norm(id)+'|'+norm(nm);
const hasSync=()=>!!SYNC_URL;

/* ── state ───────────────────────────────────────────────────── */
let cur=iso(new Date()), meal='bf', filter='all', q='', undoSnap=null;
let people=[], data={}, guests=[], carried=false, updated=0;
let cfg={}, queue=[], isAdmin=false, rosterSrc='none', syncState='off', lastErr='';
let copySrc=null, dupNames=new Set(), dupPairs=[], exactDupes=0;
let recentCache={key:null,days:{}}, copyHidden=null;

const activeOn=(p,s)=>(!p.from||p.from<=s)&&(!p.to||s<p.to);
const cnt=k=>Object.keys(data[k]||{}).length;
const dayTotal=()=>MEALS.reduce((s,m)=>s+cnt(m.k),0);
const roster=()=>people.filter(p=>activeOn(p,cur))
  .concat(guests.map(g=>({key:g.key,id:'OTHER',nm:g.nm,g:'guest'})));

/* ── cloud ───────────────────────────────────────────────────── */
function setPill(state,text){syncState=state;$('#pill').className=state;$('#pillText').textContent=text;}
function pillRefresh(){
  if(!hasSync())return setPill('off','local only');
  if(syncState==='busy')return;
  if(queue.length)return setPill('wait',queue.length+' waiting');
  if(lastErr)return setPill('err','not connected');
  setPill('ok','saved to cloud');
}
async function api(params){
  const u=new URL(SYNC_URL);
  Object.entries(Object.assign({key:SYNC_KEY},params)).forEach(([k,v])=>u.searchParams.set(k,v));
  const r=await fetch(u.toString(),{method:'GET',redirect:'follow'});
  if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json();
  if(!j.ok)throw new Error(j.error||'refused');
  return j;
}
async function apiPost(body){
  const r=await fetch(SYNC_URL,{method:'POST',redirect:'follow',
    body:JSON.stringify(Object.assign({key:SYNC_KEY},body))});
  if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json();
  if(!j.ok)throw new Error(j.error||'refused');
  return j;
}
const saveQueue=()=>store.set(QKEY,queue);
function enqueue(d){if(!queue.includes(d))queue.push(d);saveQueue();pillRefresh();}
let pushTimer=null;
function schedulePush(){if(!hasSync())return;clearTimeout(pushTimer);pushTimer=setTimeout(flush,1200);}

async function flush(){
  if(!hasSync()||!queue.length)return;
  setPill('busy','saving…');
  for(const date of queue.slice()){
    const rec=await store.get(dkey(date));
    if(!rec){queue=queue.filter(d=>d!==date);continue;}
    try{
      const res=await apiPost({action:'save',date,payload:rec,device:cfg.dev,updated:rec.updated||Date.now()});
      queue=queue.filter(d=>d!==date); lastErr='';
      if(res.stale&&res.payload){
        await store.set(dkey(date),Object.assign(res.payload,{updated:res.updated}));
        if(date===cur){await loadDay(true);toast('The office had a newer copy of this day');}
      }
    }catch(e){lastErr=e.message;break;}
  }
  await saveQueue(); pillRefresh();
}
async function pullDay(date){
  if(!hasSync())return null;
  try{
    const j=await api({action:'day',date}); lastErr='';
    return j.payload?Object.assign(j.payload,{updated:j.updated||0}):null;
  }catch(e){lastErr=e.message;return null;}
}

/* ── roster: cloud → repo file → saved copy ──────────────────── */
function rowsToPeople(rows){
  const out=[],seen=new Set(),byName={};
  exactDupes=0;
  rows.forEach(c=>{
    const id=String(c[0]||'HIRE').trim().toUpperCase(), nm=String(c[1]||'').trim();
    if(!nm)return;
    let g=String(c[2]||'').trim().toLowerCase();
    if(!GROUPS[g]||g==='guest')g=id==='HIRE'?'hire':(/^(MES|SES)/.test(id)?'staff':'worker');
    const k=pkey(id,nm);
    if(seen.has(k)){exactDupes++;return;}   // same ID and name twice — dropped
    seen.add(k);
    const n=norm(nm);
    (byName[n]=byName[n]||[]).push(id);
    out.push({key:k,id,nm,g,from:String(c[3]||'').trim()||null,to:String(c[4]||'').trim()||null});
  });
  dupNames=new Set(); dupPairs=[];
  Object.entries(byName).forEach(([n,ids])=>{
    if(ids.length>1){dupNames.add(n);dupPairs.push({nm:n,ids});}
  });
  return out;
}
function parseCsv(t){
  return rowsToPeople(t.split(/\r?\n/).map(l=>l.trim())
    .filter(l=>l&&!l.startsWith('#')&&!/^id\s*,/i.test(l))
    .map(l=>l.split(',').map(x=>x.trim().replace(/^"|"$/g,''))));
}
async function loadRoster(){
  const cached=await store.get(RKEY);
  people=(cached&&cached.people)||[]; if(people.length)rosterSrc='saved copy';
  if(hasSync()){
    try{
      const fresh=rowsToPeople((await api({action:'roster'})).roster||[]);
      if(fresh.length){people=fresh;rosterSrc='Google Sheet';await store.set(RKEY,{people,at:Date.now()});return;}
    }catch(e){lastErr=e.message;}
  }
  try{
    const r=await fetch(ROSTER_URL+'?v='+Date.now(),{cache:'no-store'});
    if(r.ok){
      const fresh=parseCsv(await r.text());
      if(fresh.length){people=fresh;rosterSrc='roster.csv';await store.set(RKEY,{people,at:Date.now()});}
    }
  }catch(e){}
  if(!people.length)toast('No name list found — check the settings');
}

/* ── day ─────────────────────────────────────────────────────── */
async function loadDay(quiet){
  if(recentCache.key!==cur){recentCache={key:null,days:{}};copyHidden=null;}
  let rec=await store.get(dkey(cur));
  if(hasSync()&&!queue.includes(cur)){
    const cloud=await pullDay(cur);
    if(cloud&&(!rec||(cloud.updated||0)>(rec.updated||0))){rec=cloud;await store.set(dkey(cur),rec);}
  }
  data=(rec&&rec.m)||{}; guests=(rec&&rec.guests)||[];
  carried=!!(rec&&rec.carried); updated=(rec&&rec.updated)||0;
  MEALS.forEach(m=>{if(!data[m.k])data[m.k]={};});
  undoSnap=null; render(); pillRefresh();
  if(!quiet)offerCopy();
}
async function saveDay(){
  updated=Date.now();
  await store.set(dkey(cur),{m:data,guests,carried,updated});
  enqueue(cur); schedulePush();
}

/* ── copy from a previous day, on request only ───────────────── */
/* Fetches the last 7 days in ONE cloud call, then offers the most
   recent day that has counts for the meal currently on screen.      */
async function recentDays(){
  if(recentCache.key===cur)return recentCache.days;
  const dates=[]; for(let i=1;i<=LOOKBACK;i++)dates.push(shift(cur,-i));
  const days={};
  for(const d of dates){const r=await store.get(dkey(d));if(r)days[d]=r;}
  if(hasSync()&&dates.some(d=>!days[d])){
    try{
      const j=await api({action:'range',from:dates[dates.length-1],to:dates[0]});
      Object.entries(j.days||{}).forEach(([d,v])=>{
        if(v&&v.payload&&!days[d]){
          days[d]=Object.assign(v.payload,{updated:v.updated||0});
          store.set(dkey(d),days[d]);
        }
      });
      lastErr='';
    }catch(e){lastErr=e.message;}
  }
  recentCache={key:cur,days};
  return days;
}
async function offerCopy(){
  const bar=$('#copybar');
  copySrc=null;
  if(copyHidden===cur+'|'+meal){bar.classList.remove('on');return;}
  if(cnt(meal)>0){bar.classList.remove('on');return;}
  const days=await recentDays();
  const label=MEALS.find(m=>m.k===meal).short.toLowerCase();
  for(let i=1;i<=LOOKBACK;i++){
    const s2=shift(cur,-i), rec=days[s2];
    if(rec&&rec.m&&Object.keys(rec.m[meal]||{}).length){copySrc={date:s2,rec};break;}
  }
  if(!copySrc){bar.classList.remove('on');return;}
  const n=Object.keys(copySrc.rec.m[meal]).length;
  $('#copyText').innerHTML=`No ${esc(label)} counted yet. <b>Copy ${n} from ${pretty(copySrc.date)}?</b>`;
  bar.classList.add('on');
}
async function doCopy(all){
  if(!copySrc)return;
  if(all)MEALS.forEach(m=>{data[m.k]=Object.assign({},copySrc.rec.m[m.k]||{});});
  else data[meal]=Object.assign({},copySrc.rec.m[meal]||{});
  carried=true; await saveDay(); render();
  $('#copybar').classList.remove('on');
  toast(`Copied from ${pretty(copySrc.date)} — check the list and correct it`);
}
$('#copyBtn').addEventListener('click',()=>doCopy(false));
$('#cx').addEventListener('click',()=>{copyHidden=cur+'|'+meal;$('#copybar').classList.remove('on');});

/* ── render ──────────────────────────────────────────────────── */
function render(){renderHead();renderFilters();renderList();renderRail();}
function renderHead(){
  $('#dpick').value=cur;
  $('#meals').innerHTML=MEALS.map(m=>{const c=cnt(m.k);
    return `<button class="meal" role="tab" data-meal="${m.k}" aria-selected="${m.k===meal}">
      <span class="ml">${esc(m.short)}</span><span class="mc${c?'':' zero'}">${c||'–'}</span></button>`;}).join('');
}
function renderFilters(){
  const r=roster(),counts={all:r.length};
  GORDER.forEach(g=>counts[g]=r.filter(p=>p.g===g).length);
  const opts=[['all','Everyone']].concat(GORDER.filter(g=>counts[g]>0).map(g=>[g,GROUPS[g]]));
  $('#filters').innerHTML=opts.map(([g,l])=>
    `<button class="chip" data-filter="${g}" aria-pressed="${filter===g}">${esc(l)} ${counts[g]}</button>`).join('');
}
function visible(){
  const t=q.trim().toUpperCase();
  return roster().filter(p=>{
    if(filter!=='all'&&p.g!==filter)return false;
    return !t||p.nm.toUpperCase().includes(t)||p.id.toUpperCase().includes(t);
  }).sort((a,b)=>GORDER.indexOf(a.g)-GORDER.indexOf(b.g));
}
function renderList(){
  const sel=data[meal]||{},v=visible();
  if(!v.length){$('#list').innerHTML=`<div class="empty"><b>${q?'No match for “'+esc(q)+'”':'Nobody on the list'}</b>${q?'Check the spelling, or clear the search.':'Ask the office to check the name list.'}</div>`;return;}
  let html='',lastG=null;
  v.forEach(p=>{
    if(p.g!==lastG){html+=`<div class="grouphdr">${esc(GROUPS[p.g])}</div>`;lastG=p.g;}
    const isDup=dupNames.has(norm(p.nm));
    html+=`<div class="row${sel[p.key]?' on':''}${isDup?' warn':''}" data-key="${esc(p.key)}" role="checkbox" aria-checked="${!!sel[p.key]}" tabindex="0">
      <div class="tick">✓</div><div class="who"><div class="nm">${esc(p.nm)}</div>
      <div class="id">${esc(p.id)}${isDup?'<span class="dup">SAME NAME TWICE</span>':''}</div></div></div>`;
  });
  html+=`<button class="guestbtn" id="addGuest">+ Add a guest or visitor</button>`;
  $('#list').innerHTML=html;
}
function renderRail(){
  const el=$('#count');el.textContent=cnt(meal);
  $('#mealNow').textContent=MEALS.find(m=>m.k===meal).short;
  $('#undo').disabled=!undoSnap;
  el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');
}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2400);}

/* ── counting ────────────────────────────────────────────────── */
function toggle(key){
  const sel=data[meal];
  if(sel[key])delete sel[key];else sel[key]=1;
  carried=false;saveDay();
  const row=document.querySelector(`.row[data-key="${CSS.escape(key)}"]`);
  if(row){row.classList.toggle('on',!!sel[key]);row.setAttribute('aria-checked',!!sel[key]);}
  renderHead();renderRail();$('#copybar').classList.remove('on');
}
$('#list').addEventListener('click',e=>{
  if(e.target.closest('#addGuest'))return addGuest();
  const row=e.target.closest('.row');if(row)toggle(row.dataset.key);
});
$('#list').addEventListener('keydown',e=>{
  const row=e.target.closest('.row');
  if(row&&(e.key===' '||e.key==='Enter')){e.preventDefault();toggle(row.dataset.key);}
});
$('#meals').addEventListener('click',e=>{const b=e.target.closest('.meal');if(!b)return;
  meal=b.dataset.meal;undoSnap=null;render();offerCopy();});
$('#filters').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;filter=b.dataset.filter;renderFilters();renderList();});
$('#search').addEventListener('input',e=>{q=e.target.value;$('#clearSearch').style.display=q?'block':'none';renderList();});
$('#clearSearch').addEventListener('click',()=>{q='';$('#search').value='';$('#clearSearch').style.display='none';renderList();$('#search').focus();});
$('#dpick').addEventListener('change',e=>{if(e.target.value){cur=e.target.value;loadDay();}});
$('#prevDay').addEventListener('click',()=>{cur=shift(cur,-1);loadDay();});
$('#nextDay').addEventListener('click',()=>{cur=shift(cur,1);loadDay();});
$('#serveAll').addEventListener('click',()=>{
  undoSnap=Object.assign({},data[meal]);
  const v=visible();v.forEach(p=>data[meal][p.key]=1);
  carried=false;saveDay();render();$('#copybar').classList.remove('on');
  toast(`${v.length} marked served — now tap anyone who missed it`);
});
$('#clearAll').addEventListener('click',()=>{
  undoSnap=Object.assign({},data[meal]);
  visible().forEach(p=>delete data[meal][p.key]);
  saveDay();render();toast('Cleared');
});
$('#undo').addEventListener('click',()=>{if(!undoSnap)return;data[meal]=undoSnap;undoSnap=null;saveDay();render();toast('Undone');});
$('#pill').addEventListener('click',async()=>{
  if(!hasSync())return settings();
  toast('Checking the cloud…');await flush();await loadDay(true);
  toast(lastErr?'Not connected: '+lastErr:'Up to date');
});

function addGuest(){
  openSheet(`<h2>Add a guest</h2>
    <p class="sub">Saved against ${pretty(cur)} only. Sends with ID “OTHER”.</p>
    <input class="txt" id="gname" placeholder="Guest name" autocomplete="off">
    <button class="act primary" id="gsave">Add and mark served</button>
    <button class="act" data-close>Cancel</button>`);
  setTimeout(()=>$('#gname').focus(),80);
  $('#gsave').onclick=()=>{
    const nm=$('#gname').value.trim();if(!nm)return $('#gname').focus();
    const key='OTHER|'+norm(nm)+'|'+Date.now().toString(36);
    guests.push({key,nm});data[meal][key]=1;
    carried=false;saveDay();closeSheet();render();toast(nm+' added');
  };
}

/* ── the file: every day saved this month, up to today ───────── */
const HEAD=['Date','Day','ID','Name','Group'].concat(MEALS.map(m=>m.col)).concat(['Total','Source']);
function csvOf(rows){
  return '\uFEFF'+rows.map(r=>r.map(c=>{const s=String(c??'');
    return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(',')).join('\r\n');
}
function rowsFor(date,rec){
  const m=rec.m||{},gs=rec.guests||[];
  const src=rec.carried?'Copied from a previous day — not checked':'Counted';
  const dw=DOW[parseISO(date).getDay()].slice(0,3);
  const out=[];
  people.filter(p=>activeOn(p,date)).concat(gs.map(g=>({key:g.key,id:'OTHER',nm:g.nm,g:'guest'})))
    .forEach(p=>{
      const cells=MEALS.map(x=>m[x.k]&&m[x.k][p.key]?1:'');
      const tot=cells.filter(c=>c===1).length;
      if(!tot&&p.g==='guest')return;
      out.push([pretty(date),dw,p.id,p.nm,GROUPS[p.g],...cells,tot,src]);
    });
  return out;
}
async function monthRows(upto){
  const d=parseISO(upto),y=d.getFullYear(),mo=d.getMonth();
  const rows=[HEAD],summary=[];let any=false;
  for(let i=1;i<=d.getDate();i++){
    const s=`${y}-${pad(mo+1)}-${pad(i)}`;
    const rec=(s===cur)?{m:data,guests,carried}:await store.get(dkey(s));
    if(!rec)continue;
    const rs=rowsFor(s,rec);if(!rs.length)continue;
    any=true;rows.push(...rs);
    const tots=MEALS.map(x=>Object.keys((rec.m||{})[x.k]||{}).length);
    summary.push([pretty(s),DOW[parseISO(s).getDay()].slice(0,3),'TOTAL','All meals','',...tots,
      tots.reduce((a,b)=>a+b,0),rec.carried?'Copied — not checked':'Counted']);
  }
  if(!any)return null;
  rows.push([]);rows.push(['DAILY TOTALS']);rows.push(HEAD);rows.push(...summary);
  return rows;
}
function download(name,text){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8;'}));
  a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
async function buildFile(){
  const rows=await monthRows(cur);
  if(!rows){toast('Nothing counted this month yet');return null;}
  const[y,m,d]=cur.split('-');
  return{name:`Mess_${y}-${m}_upto_${d}.csv`,csv:csvOf(rows)};
}
function msgText(){
  return [`Mess count ${pretty(cur)} (${DOW[parseISO(cur).getDay()]})`]
    .concat(MEALS.filter(m=>cnt(m.k)).map(m=>`${m.short}: ${cnt(m.k)}`))
    .concat([`Total meals: ${dayTotal()}`,
             `File attached: every day of this month up to today, name by name.`]).join('\n');
}

$('#finish').addEventListener('click',sendPanel);
function sendPanel(){
  const rows=MEALS.map(m=>{const c=cnt(m.k);return `<tr class="${c?'':'z'}"><td>${esc(m.short)}</td><td>${c||'–'}</td></tr>`;}).join('');
  openSheet(`<h2>${pretty(cur)}</h2>
    <p class="sub">${DOW[parseISO(cur).getDay()]} — every tap is already saved.</p>
    ${carried?`<div class="note">These counts were copied from a previous day and not yet checked. Look through the list first.</div>`:''}
    <table class="tbl">${rows}<tr class="tot"><td>Total meals</td><td>${dayTotal()}</td></tr></table>
    <button class="act wa" id="send">Send the file to the office</button>
    ${copySrc?`<button class="act" id="cp2">Copy all meals from ${pretty(copySrc.date)}</button>`:''}
    <button class="act" id="dl">Just download the file</button>
    <button class="act" data-close>Back to the list</button>`);
  $('#send').onclick=sendFile;
  $('#dl').onclick=async()=>{const f=await buildFile();if(f){download(f.name,f.csv);toast('Saved to Downloads');}};
  if(copySrc)$('#cp2').onclick=async()=>{closeSheet();await doCopy(true);};
}
async function sendFile(){
  const f=await buildFile();if(!f)return;
  const txt=msgText();
  try{
    const file=new File([f.csv],f.name,{type:'text/csv'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],text:txt,title:'Mess count '+pretty(cur)});
      closeSheet();toast('Sent');return;
    }
  }catch(e){if(e&&e.name==='AbortError')return;}
  download(f.name,f.csv);
  const num=(cfg.wa||'').replace(/[^0-9]/g,'');
  if(num){window.open(`https://wa.me/${num}?text=${encodeURIComponent(txt)}`,'_blank');
    toast('File downloaded — attach it in WhatsApp');}
  else askWA(txt);
}
function askWA(txt){
  openSheet(`<h2>Office WhatsApp number</h2>
    <p class="sub">Saved once on this phone. Country code, no plus sign — for Oman, 968 then the number.</p>
    <input class="txt" id="wanum" inputmode="numeric" placeholder="96891234567" value="${esc(cfg.wa||'')}">
    <button class="act wa" id="wasave">Save and open WhatsApp</button>
    <button class="act" data-close>Skip — the file is in Downloads</button>`);
  $('#wasave').onclick=async()=>{
    const n=$('#wanum').value.replace(/[^0-9]/g,'');
    if(n.length<8)return toast('That number looks too short');
    cfg.wa=n;await store.set(CKEY,cfg);closeSheet();
    window.open(`https://wa.me/${n}?text=${encodeURIComponent(txt)}`,'_blank');
    toast('Attach the downloaded file in WhatsApp');
  };
}

/* ── settings (admin link only) ──────────────────────────────── */
$('#gear').addEventListener('click',settings);
async function settings(){
  const cached=await store.get(RKEY);
  const when=cached&&cached.at?new Date(cached.at).toLocaleString():'—';
  openSheet(`<h2>Settings</h2>
    <p class="sub">Diagnostics and backup. The warden's link does not show this.</p>
    <div class="kv">
      <div>Cloud sync<span>${hasSync()?'on':'not set up'}</span></div>
      <div>Days waiting to upload<span>${queue.length}</span></div>
      <div>Last error<span>${esc(lastErr||'none')}</span></div>
      <div>Name list from<span>${esc(rosterSrc)}</span></div>
      <div>People on the list<span>${people.length}</span></div>
      <div>Same name twice<span>${dupPairs.length}</span></div>
      <div>Identical rows dropped<span>${exactDupes}</span></div>
      <div>List last refreshed<span>${esc(when)}</span></div>
      <div>This device<span>${esc(cfg.dev||'—')}</span></div>
    </div>
    ${hasSync()
      ?`<button class="act primary" id="sTest">Test the connection</button>
        <button class="act" id="sPush">Upload everything waiting</button>`
      :`<div class="note">Cloud sync is off, so this phone keeps its own counts. Put the Apps Script address into <b>SYNC_URL</b> in index.html to turn it on.</div>`}
    ${dupPairs.length?`<div class="note"><b>${dupPairs.length} name${dupPairs.length>1?'s appear':' appears'} more than once in the Roster tab.</b> They are flagged red in the list so nobody gets served twice. Fix them in the Sheet.</div>
    <div class="duplist">${dupPairs.slice(0,12).map(d=>`<div>${esc(d.nm)}<div class="idl">${esc(d.ids.join(' · '))}</div></div>`).join('')}</div>`:''}
    <button class="act" id="sRoster">Refresh the name list now</button>
    <button class="act" id="sBackup">Download this month as a backup</button>
    <button class="act" data-close>Done</button>`);
  if(hasSync()){
    $('#sTest').onclick=async()=>{
      try{const j=await api({action:'ping'});lastErr='';toast('Connected — '+new Date(j.time).toLocaleTimeString());}
      catch(e){lastErr=e.message;toast('Failed: '+e.message);}
      pillRefresh();settings();
    };
    $('#sPush').onclick=async()=>{await flush();toast(queue.length?queue.length+' still waiting':'All uploaded');settings();};
  }
  $('#sRoster').onclick=async()=>{await loadRoster();render();toast(people.length+' names from '+rosterSrc);settings();};
  $('#sBackup').onclick=async()=>{const f=await buildFile();if(f){download(f.name,f.csv);toast('Saved to Downloads');}};
}

/* ── sheet plumbing ──────────────────────────────────────────── */
function openSheet(h){$('#sheet').innerHTML=h;$('#sheet').classList.add('open');$('#veil').classList.add('open');}
function closeSheet(){$('#sheet').classList.remove('open');$('#veil').classList.remove('open');}
$('#veil').addEventListener('click',closeSheet);
$('#sheet').addEventListener('click',e=>{if(e.target.closest('[data-close]'))closeSheet();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});
window.addEventListener('online',()=>{lastErr='';flush();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&hasSync())flush();});

/* ── boot ────────────────────────────────────────────────────── */
(async()=>{
  isAdmin=new URLSearchParams(location.search).get('admin')===ADMIN_CODE;
  if(isAdmin)$('#gear').classList.add('on');
  cfg=await store.get(CKEY)||{};
  if(!cfg.dev){cfg.dev='D-'+Math.random().toString(36).slice(2,7).toUpperCase();await store.set(CKEY,cfg);}
  queue=await store.get(QKEY)||[];
  setPill(hasSync()?'busy':'off',hasSync()?'connecting…':'local only');
  await loadRoster();
  await loadDay();
  flush();
})();
</script>
